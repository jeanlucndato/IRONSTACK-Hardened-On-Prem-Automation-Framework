name: IRONSTACK CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted  # CRITIQUE : Utilise ton runner local
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          # Créer le réseau s'il n'existe pas
          docker network inspect ironstack_network >/dev/null 2>&1 || \
          docker network create ironstack_network

      - name: Deploy Database
        run: |
          cd db
          docker-compose down
          docker-compose up -d --remove-orphans

      - name: Deploy Ingress & Dashboard
        run: |
          cd nginx
          docker-compose down
          docker-compose up -d --build

      - name: Run Python Infrastructure Audit
        run: |
          # On utilise l'environnement virtuel pour l'audit final
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          python3 infra_manager.py
