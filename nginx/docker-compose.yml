version: '3.8'

services:
  nginx_ingress:
    image: nginx:latest
    container_name: nginx_ingress
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: always
    networks:
      - ironstack_network

networks:
  ironstack_network:
    external: true
