<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRONSTACK | Ingress Dashboard</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); width: 400px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; letter-spacing: 2px; color: #f8fafc; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; }
        .status-list { text-align: left; list-style: none; padding: 0; }
        .status-item { padding: 10px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        .status-ok { color: #4ade80; font-weight: bold; }
        .badge { background: #38bdf8; color: #0f172a; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .footer { margin-top: 2rem; font-size: 0.7rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>IRONSTACK CORE</h1>
        <div class="badge">ON-PREM INGRESS ACTIVE</div>
        <ul class="status-list">
            <li class="status-item"><span>Nginx Ingress</span> <span class="status-ok">✔ ONLINE</span></li>
            <li class="status-item"><span>Docker Engine</span> <span class="status-ok">✔ ACTIVE</span></li>
            <li class="status-item"><span>PostgreSQL DB</span> <span class="status-ok">✔ CONNECTED</span></li>
        </ul>
        <div class="footer">
            Location: Goma, DRC | Node: aptserver<br>
            Protected by IRONSTACK Automation Framework
        </div>
    </div>
</body>
</html>
