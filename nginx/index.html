<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRONSTACK // Security Dashboard</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #58a6ff; --success: #3fb950; --border: #30363d; }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Inter', -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .dashboard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        h1 { color: var(--accent); font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .status-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: rgba(0,0,0,0.2); margin-bottom: 0.5rem; border-radius: 6px; border-left: 4px solid var(--success); }
        .label { font-weight: 600; font-size: 0.9rem; }
        .badge { background: rgba(63, 185, 80, 0.1); color: var(--success); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; border: 1px solid var(--success); }
        .footer { margin-top: 1.5rem; font-size: 0.7rem; color: #8b949e; text-align: center; font-family: monospace; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header"><h1>⚙️ IRONSTACK SYSTEM</h1></div>
        <div class="status-item"><span class="label">NGINX INGRESS</span><span class="badge">SECURED</span></div>
        <div class="status-item"><span class="label">POSTGRESQL DB</span><span class="badge">ENCRYPTED</span></div>
        <div class="status-item"><span class="label">PYTHON AUDIT</span><span class="badge">PASSING</span></div>
        <div class="footer">LOCATION: ON-PREM // ENCLAVE: APT41-SERVER</div>
    </div>
</body>
</html>
